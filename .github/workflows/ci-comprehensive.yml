name: Comprehensive CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  TF_VERSION: "1.6.0"
  AWS_REGION: us-east-1

jobs:
  # Django application tests
  test:
    name: Django Tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: django-insecure-test-key-for-ci-only
      DEBUG: False
      DATABASE_URL: sqlite:///test_db.sqlite3
      PROSOPO_SITE_KEY: test-site-key
      PROSOPO_SECRET_KEY: test-secret-key
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DEFAULT_FROM_EMAIL: test@example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run tests with coverage
        run: |
          coverage run --source='.' manage.py test
          coverage report --show-missing
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Run Django security check
        run: python manage.py check --deploy

  # Code quality and linting
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code formatting with black
        run: black --check --diff .

      - name: Check import sorting with isort
        run: isort --check-only --diff .

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run security checks with bandit
        run: |
          bandit -r . -x ./venv/,./test_*.py --severity-level medium

      - name: Run Safety CLI to check for vulnerabilities
        uses: pyupio/safety-action@v1
        with:
          api-key: ${{ secrets.SAFETY_API_KEY }}

  # Terraform validation (only runs if terraform files changed)
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'terraform') || contains(join(github.event.commits.*.modified, ' '), 'terraform/') || contains(join(github.event.commits.*.added, ' '), 'terraform/')
    
    strategy:
      matrix:
        directory:
          - terraform/shared
          - terraform/environments/staging
          - terraform/environments/prod
          - terraform/modules/apprunner
          - terraform/modules/database-setup
          - terraform/modules/database
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  # Terraform security scanning (only runs if terraform files changed)
  terraform-security:
    name: Terraform Security
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'terraform') || contains(join(github.event.commits.*.modified, ' '), 'terraform/') || contains(join(github.event.commits.*.added, ' '), 'terraform/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov scan
        run: |
          checkov -d terraform/ \
            --framework terraform \
            --output cli \
            --soft-fail \
            --skip-check CKV_AWS_144,CKV_AWS_145,CKV_AWS_19 \
            --quiet

      - name: Install TFSec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run TFSec scan
        run: |
          tfsec terraform/ \
            --soft-fail \
            --exclude-downloaded-modules

  # Build and push Docker image (only on push, not PR)
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: github.event_name == 'push' && (needs.test.result == 'success' && needs.lint.result == 'success' && needs.security.result == 'success')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials for ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CI_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CI_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker tags
        id: docker-tags
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          SHA="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          
          # Always include the commit SHA
          TAGS="${REGISTRY}/hogtown-app:${SHA}"
          
          # Branch-specific tags
          if [ "$BRANCH" = "main" ]; then
            # Production tags
            TAGS="${TAGS},${REGISTRY}/hogtown-app:latest"
            TAGS="${TAGS},${REGISTRY}/hogtown-app:prod-${SHA:0:7}"
            TAGS="${TAGS},${REGISTRY}/hogtown-app:prod"
          elif [ "$BRANCH" = "develop" ]; then
            # Development tags
            TAGS="${TAGS},${REGISTRY}/hogtown-app:develop-latest"
            TAGS="${TAGS},${REGISTRY}/hogtown-app:develop-${SHA:0:7}"
            TAGS="${TAGS},${REGISTRY}/hogtown-app:develop"
          else
            # Feature branch or PR
            # Replace slashes with dashes for valid Docker tags
            SAFE_BRANCH=$(echo "$BRANCH" | sed 's/\//-/g')
            TAGS="${TAGS},${REGISTRY}/hogtown-app:${SAFE_BRANCH}-${SHA:0:7}"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Collect and upload static files to S3
  static-files:
    name: Upload Static Files to S3
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    env:
      SECRET_KEY: django-insecure-test-key-for-ci-only
      DEBUG: False
      DATABASE_URL: sqlite:///test_db.sqlite3
      PROSOPO_SITE_KEY: test-site-key
      PROSOPO_SECRET_KEY: test-secret-key
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DEFAULT_FROM_EMAIL: test@example.com
      USE_S3: True
      AWS_STORAGE_BUCKET_NAME: hogtown-static-files
      AWS_CLOUDFRONT_DOMAIN: static.hogtowncatholic.com
      AWS_REGION: us-east-1
      AWS_LOCATION: staging/static
      AWS_S3_ACCESS_KEY_ID: ${{ secrets.CI_ACCESS_KEY_ID }}
      AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.CI_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials for S3
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CI_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CI_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Collect and upload static files to S3
        run: |
          echo "Collecting static files and uploading to S3..."
          echo "USE_S3=$USE_S3"
          echo "AWS_STORAGE_BUCKET_NAME=$AWS_STORAGE_BUCKET_NAME"
          echo "AWS_LOCATION=$AWS_LOCATION"
          python manage.py collectstatic --noinput --verbosity 2
          echo "Static files uploaded successfully!"