name: Build and Push to ECR

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  AWS_REGION: us-east-1

jobs:
  # Run tests and validation first
  test:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      SECRET_KEY: django-insecure-test-key-for-ci-only
      DEBUG: False
      DATABASE_URL: sqlite:///test_db.sqlite3
      PROSOPO_SITE_KEY: test-site-key
      PROSOPO_SECRET_KEY: test-secret-key
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DEFAULT_FROM_EMAIL: test@example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check Django configuration
        run: |
          python manage.py check

      - name: Run migrations
        run: |
          python manage.py migrate

      - name: Collect static files
        run: |
          python manage.py collectstatic --noinput

      - name: Run tests with coverage
        run: |
          coverage run --source='.' manage.py test
          coverage report --show-missing

      - name: Run Django security check
        run: |
          python manage.py check --deploy

  # Code linting and formatting checks
  lint:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code formatting with black
        run: |
          black --check --diff .

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff .

  # Terraform validation for infrastructure changes
  terraform-validate:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        directory:
          - terraform/shared
          - terraform/environments/staging
          - terraform/environments/prod
          - terraform/modules/apprunner
          - terraform/modules/database-setup
          - terraform/modules/database
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format Check
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  # Build and push Docker image only if all validation passes
  build:
    runs-on: ubuntu-latest
    needs: [test, lint, terraform-validate]
    # Only build if all validations succeed
    if: needs.test.result == 'success' && needs.lint.result == 'success' && needs.terraform-validate.result == 'success'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials for ECR
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.ECR_PUSH_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.ECR_PUSH_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up Docker tags
      id: docker-tags
      run: |
        REGISTRY="${{ steps.login-ecr.outputs.registry }}"
        SHA="${{ github.sha }}"
        BRANCH="${{ github.ref_name }}"
        
        # Always include the commit SHA
        TAGS="${REGISTRY}/hogtown-app:${SHA}"
        
        # Branch-specific tags
        if [ "$BRANCH" = "main" ]; then
          # Production tags
          TAGS="${TAGS},${REGISTRY}/hogtown-app:latest"
          TAGS="${TAGS},${REGISTRY}/hogtown-app:prod-${SHA:0:7}"
          TAGS="${TAGS},${REGISTRY}/hogtown-app:prod"
        elif [ "$BRANCH" = "develop" ]; then
          # Development tags
          TAGS="${TAGS},${REGISTRY}/hogtown-app:develop-latest"
          TAGS="${TAGS},${REGISTRY}/hogtown-app:develop-${SHA:0:7}"
          TAGS="${TAGS},${REGISTRY}/hogtown-app:develop"
        else
          # Feature branch or PR
          # Replace slashes with dashes for valid Docker tags
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's/\//-/g')
          TAGS="${TAGS},${REGISTRY}/hogtown-app:${SAFE_BRANCH}-${SHA:0:7}"
        fi
        
        echo "tags=${TAGS}" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.docker-tags.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

